name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: rm -f package-lock.json
      - run: npm install
        env:
          NODE_ENV: development
      - run: npx vite build

      # Generate the static CV PDF served by the export button.
      # puppeteer is installed here (not in package.json) because the
      # Betclic-internal registry used on workstations can't provide it.
      - run: npm install --no-save puppeteer
      - run: node scripts/generate-pdf.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
